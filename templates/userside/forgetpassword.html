{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password</title>
    
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/icons.css' %}">

    <style>
        body {
            background-color: #f0f2f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .card {
            border-radius: 12px;
            border: none;
        }

        .btn-outline-primary {
            padding: 10px;
            font-weight: 600;
            border-radius: 30px;
        }

        .form-group label {
            font-weight: 500;
        }

        .form-control {
            border-radius: 8px;
        }

        .message-box p {
            margin: 0;
            font-size: 14px;
        }

        .logo {
            text-align: center;
            margin-bottom: 15px;
        }

        .logo img {
            max-height: 50px;
        }
    </style>
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
        <div class="col-12 col-sm-10 col-md-8 col-lg-5">
            <div class="card shadow">
                <div class="card-body p-4">
                    <h4 class="text-center mb-4">Forgot Your Password?</h4>
                    
                    <form method="post" action="{% url 'logintohome:reset_otp' %}">
                        {% csrf_token %}
                        
                        <div class="form-group">
                            <label for="email">Email Address *</label>
                            <input type="email" name="email" id="email" class="form-control" placeholder="example@gmail.com" required>
                        </div>

                        <div class="mt-4">
                            <button type="submit" class="btn btn-outline-primary btn-block">
                                Send Reset Link <i class="icon-long-arrow-right ml-2"></i>
                            </button>
                        </div>

                        {% if messages %}
                        <div class="mt-3 message-box">
                            {% for message in messages %}
                                <p class="text-{{ message.tags }}">{{ message }}</p>
                            {% endfor %}
                        </div>
                        {% endif %}
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Optional Bootstrap JS (if needed) -->
    <script src="{% static 'js/bootstrap.min.js' %}"></script>
</body>
</html>
